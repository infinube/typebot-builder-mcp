services:
  typebot-builder-mcp:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_HOST: 0.0.0.0
      SNAPSHOT_DIR: /data/snapshots
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - snapshots:/data/snapshots
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
volumes:
  snapshots:
